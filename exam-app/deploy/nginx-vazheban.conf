# آزمون واژه‌بان — پورت اختصاصی، جدا از مودل و Forecast Studio
server {
    listen 8444 ssl http2;
    server_name 46-34-163-254.sslip.io 46.34.163.254;

    client_max_body_size 5M;

    ssl_certificate     /etc/letsencrypt/live/46-34-163-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46-34-163-254.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
